services:
  - type: web
    name: fitpulse-agency
    runtime: node
    plan: free
    buildCommand: "echo no build step"
    startCommand: node server/index.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: BOSS_USERNAME
        value: boss
      - key: BOSS_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TIMEZONE
        value: Europe/Kyiv
      - key: PUBLIC_URL
        sync: false
      - key: BOSS_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SHEETS_WEBAPP_URL
        sync: false
      - key: BRIDGE_SECRET
        sync: false
      - key: SHEET_URL
        sync: false
      - key: CLIENT_NAME
        value: Iron Pulse Gym
